$kind: http-request
name: Atualizar Produto
method: PUT
url: '{{base_url}}/produtos/:id'
order: 2000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '1'
body:
  type: json
  content: |-
    {
      "nome": "Produto Atualizado",
      "quantidade": 20,
      "preco": 49.99
    }
